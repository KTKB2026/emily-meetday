<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e1116">
<meta name="robots" content="noindex">
<title>MASS Meet Day</title>
<style>
  :root{
    --ink:#0e1116; --panel:#171c24; --panel2:#1f2630; --line:#2c3540;
    --text:#e8ebef; --dim:#8b95a3;
    --sn:#e0a33c; --cj:#5fb4e6;
    --good:#4cc38a; --warn:#e0a33c; --stop:#e0635a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--ink);color:var(--text);font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;font-size:16px;line-height:1.45;padding:12px 14px 124px;max-width:560px;margin:0 auto}
  header{margin-bottom:10px}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
  .athchips{display:flex;gap:6px;flex-shrink:0}
  .athchips button{width:34px;height:34px;border-radius:9px;background:var(--panel);border:1px solid var(--line);color:var(--dim);font:inherit;font-size:14px;font-weight:800;cursor:pointer}
  .athchips button.on{background:var(--panel2);color:var(--ac);border-color:var(--ac)}
  h1{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
  .sub{color:var(--dim);font-size:12px;margin-top:4px}

  input,textarea{font-family:inherit;color:var(--text);background:transparent;border:none;outline:none}
  input:focus{background:rgba(255,255,255,.07);border-radius:4px}

  /* day schedule strip (collapsible) */
  .sched{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:10px}
  .sched-head{display:flex;align-items:center;gap:8px;padding:9px 0;cursor:pointer;user-select:none}
  .sched-head .st{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;flex-shrink:0}
  .sched-sum{flex:1;min-width:0;font-size:11px;color:var(--dim);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .chev{color:var(--dim);font-size:12px;flex-shrink:0;transition:transform .15s}
  .sched.open .chev{transform:rotate(90deg)}
  .sched-body{display:none;padding-bottom:4px}
  .sched.open .sched-body{display:block}
  .srow{display:flex;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--line)}
  .srow .sname{font-size:12px;font-weight:800;width:52px;flex-shrink:0;cursor:pointer;color:var(--ac);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srow input{flex:1;min-width:0;background:var(--panel2);border-radius:6px;font-size:12px;padding:6px 5px;text-align:center}
  .srow input.sbw{flex:0 0 58px}

  /* STICKY BAR */
  .stick{
    position:sticky;top:8px;z-index:50;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:8px 10px;margin-bottom:10px;
    box-shadow:0 6px 18px rgba(0,0,0,.45);user-select:none;
  }
  .st-top{display:flex;align-items:center;gap:6px}
  .cnt{display:flex;align-items:center;gap:5px}
  .cbtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;font:inherit;font-weight:800;cursor:pointer}
  .cbtn.minus{font-size:17px;padding:9px 14px}
  .cbtn.plus{font-size:12px;padding:5px 8px;color:var(--dim)}
  #cnum{width:58px;font-size:24px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;background:var(--panel2);border:1px dashed var(--dim);border-radius:9px;padding:5px 0}
  #cnum.set{border:1px solid var(--line)}
  .cnumwrap{position:relative;display:flex}
  .info{position:absolute;top:-9px;right:-9px;z-index:5;width:18px;height:18px;border-radius:50%;background:var(--ink);border:1px solid var(--dim);color:var(--dim);font:inherit;font-size:11px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .clab{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);line-height:1.2}
  .clk{display:flex;align-items:center;gap:6px;cursor:pointer;padding:2px 4px;border-radius:9px;border:1px solid transparent;flex-shrink:0;margin-left:auto;text-align:right}
  .clk .cl-time{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .clk.run{border-color:var(--good)} .clk.run .cl-time{color:var(--good)}
  .clk .cl-sub{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);line-height:1.2}
  .clk .cl-sub.slow{color:var(--warn);font-weight:700}
  .crst{background:var(--panel2);border:1px solid var(--line);color:var(--dim);font:inherit;font-size:11px;font-weight:700;border-radius:7px;padding:4px 7px;cursor:pointer}
  .st-take{display:none;font-size:13px;font-weight:600;text-align:center;margin-top:7px;padding:6px 8px;border-radius:8px;background:var(--panel2);color:var(--dim)}
  .st-take.show{display:block}
  .st-take.due{background:rgba(224,163,60,.16);color:var(--warn)}
  .st-take.late{background:rgba(224,99,90,.16);color:var(--stop)}
  .st-take .tl-lift{font-weight:800}

  /* ATHLETE CONTAINERS + TABS */
  .ath{display:none}
  .ath.on{display:block}
  .tab{display:none}
  .tab.on{display:block}
  .tabbar{
    position:fixed;bottom:0;left:0;right:0;z-index:60;
    background:rgba(14,17,22,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex;justify-content:space-around;gap:2px;
    padding:8px 6px calc(22px + env(safe-area-inset-bottom));
  }
  .tabbar button{flex:1;background:none;border:none;color:var(--dim);font:inherit;font-size:13px;font-weight:700;letter-spacing:.04em;padding:15px 2px;border-radius:10px;cursor:pointer}
  .tabbar button.on{background:var(--panel2);color:var(--text)}
  #tb-sn.on{color:var(--sn)} #tb-cj.on{color:var(--cj)}

  /* LIFT CARDS */
  .lift{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;overflow:hidden}
  .lift-head{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 8px}
  .lift-name{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  .lift.sn .lift-name{color:var(--sn)} .lift.cj .lift-name{color:var(--cj)}
  .lift-ref{font-size:11px;color:var(--dim)}

  /* warm-up rows */
  .wu-cols{display:grid;grid-template-columns:40px 1fr 64px 52px 30px;gap:8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:2px 14px 4px}
  .wu-list{padding:0 14px}
  .wu-row{display:grid;grid-template-columns:40px 1fr 64px 52px 30px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;border-radius:8px;cursor:pointer}
  .wu-row:last-of-type{border-bottom:none}
  .wu-row input{font-size:15px;font-variant-numeric:tabular-nums;padding:5px 6px;background:var(--panel2);border-radius:6px;width:100%;pointer-events:auto}
  .wu-row input.aout{text-align:center;color:var(--dim);font-size:13px}
  .wu-row input.reps{text-align:center}
  .wu-row .chk{width:26px;height:26px;border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px;font-weight:800}
  .wu-row .del{width:26px;height:26px;border:1px solid var(--stop);border-radius:7px;display:none;align-items:center;justify-content:center;color:var(--stop);font-size:14px;font-weight:800;background:rgba(224,99,90,.1)}
  .wu-list.editing .chk{display:none}
  .wu-list.editing .del{display:flex}
  .wu-row.done{opacity:.42}
  .wu-row.done .chk{color:var(--good);border-color:var(--good);background:rgba(76,195,138,.12)}
  .wu-row.due{background:rgba(224,163,60,.13);box-shadow:inset 0 0 0 1px var(--warn)}
  .wu-row.late{background:rgba(224,99,90,.13);box-shadow:inset 0 0 0 1px var(--stop)}
  .wu-btns{display:flex;gap:8px;margin:10px 14px 12px}
  .wu-add{flex:1;background:var(--panel2);border:1px dashed var(--line);color:var(--dim);font-size:13px;border-radius:8px;padding:8px;cursor:pointer;font-family:inherit}
  .wu-edit{background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:700;border-radius:8px;padding:8px 14px;cursor:pointer;font-family:inherit}
  .wu-edit.on{color:var(--stop);border-color:var(--stop)}

  /* attempts */
  .attempts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line)}
  .att{background:var(--panel2);padding:10px 4px 8px;text-align:center}
  .att .lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .att .kgrow{display:flex;align-items:center;gap:2px;margin:2px 0}
  .att .stp{background:var(--ink);border:1px solid var(--line);color:var(--dim);font:inherit;font-size:16px;font-weight:800;border-radius:7px;width:26px;height:34px;flex-shrink:0;cursor:pointer}
  .att input.kg{width:100%;min-width:0;font-size:25px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;padding:2px 0}
  .att .plates{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;min-height:13px}
  .att .rng{display:flex;justify-content:center;align-items:center;gap:2px;margin-top:3px}
  .att .rng input{width:26px;font-size:12px;text-align:center;color:var(--dim);font-variant-numeric:tabular-nums;padding:2px 0;background:var(--ink);border-radius:4px}
  .att .rng input.pl{color:var(--text);font-weight:700}
  .att .rng .dot{font-size:10px;color:var(--line)}
  .att .rlab{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:2px}
  .att .mark{font-size:11px;font-weight:700;margin-top:6px;padding:6px 0;border-radius:6px;border:1px solid var(--line);color:var(--dim);cursor:pointer;user-select:none}
  .att.good{background:rgba(76,195,138,.13)} .att.good .mark{color:var(--good);border-color:var(--good)}
  .att.miss{background:rgba(224,99,90,.13)} .att.miss .mark{color:var(--stop);border-color:var(--stop)}
  .sugg{font-size:13px;font-weight:600;color:var(--warn);padding:8px 14px 0;display:none}
  .sugg.show{display:block}
  .strategy{padding:10px 14px;font-size:13px;color:#c2c9d2;border-top:1px solid var(--line);margin-top:10px}
  .strategy b{color:var(--text)}

  /* strips */
  .strip{background:var(--panel2);border:1px solid var(--line);border-top:none;margin:0 12px 14px;padding:10px 12px 12px;border-radius:0 0 12px 12px}
  .strip-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .strip-title{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .strip-live{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
  .strip-live small{font-size:10px;font-weight:600;color:var(--dim);letter-spacing:.08em}
  .scen{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .scen .s{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center}
  .scen .s .sl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .scen .s .sv{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
  .scen .s.dead{opacity:.35}
  .tgt{display:flex;gap:10px;align-items:center;margin-top:10px}
  .tgt label{font-size:13px;color:var(--dim);flex:1}
  .tgt input{background:var(--ink);border:1px solid var(--line);border-radius:8px;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;width:90px;padding:6px 10px;text-align:center}
  .needs{font-size:14px;font-weight:700;margin-top:8px;text-align:center;min-height:18px}
  .ok{color:var(--good)} .cau{color:var(--warn)} .halt{color:var(--stop)}

  h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:20px 0 10px;display:flex;align-items:center;gap:10px}
  h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .tab > h2:first-child{margin-top:4px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .row:last-child{border-bottom:none}
  .row .k{color:var(--dim);flex-shrink:0}
  .row .v{text-align:right;font-variant-numeric:tabular-nums}
  .row input.entry,.row input.refv{background:var(--panel2);border-radius:6px;font-size:14px;font-variant-numeric:tabular-nums;text-align:right;width:110px;padding:5px 8px}
  .note{font-size:13px;color:#c2c9d2;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:14px}
  .note b{color:var(--text)}

  .hist-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
  table{border-collapse:collapse;font-size:12px;white-space:nowrap;width:100%}
  th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  tbody:last-child tr:last-child td{border-bottom:none}
  td.mk{color:var(--good)} td.ms{color:var(--stop)}
  td.tot{font-weight:700}
  td.empty{color:var(--dim);text-align:center;padding:14px 8px}
  .hist-note{font-size:11px;color:var(--dim);margin-top:8px}
  .hist-btns{display:flex;gap:8px;margin:12px 0}
  .hist-btns button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;font-size:13px;font-weight:700;border-radius:10px;padding:10px;cursor:pointer}
  .archlink{display:block;text-align:center;margin:18px 0 4px;padding:11px;border:1px dashed var(--line);border-radius:10px;color:var(--dim);font-size:13px;text-decoration:none}

  /* records card */
  .recrow{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
  .recrow:last-child{border-bottom:none}
  .recrow input.recl{flex:1;min-width:0;background:var(--panel2);border-radius:6px;font-size:13px;padding:6px 8px;color:var(--dim)}
  .recrow input.recv{width:96px;background:var(--panel2);border-radius:6px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right;padding:6px 8px}

  textarea.notes{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;min-height:140px;resize:vertical}
  .reset{margin-top:18px;width:100%;background:var(--panel);border:1px solid var(--line);color:var(--stop);font:inherit;font-size:13px;font-weight:700;border-radius:10px;padding:11px;cursor:pointer}
  footer{margin-top:22px;font-size:11px;color:var(--dim);text-align:center;line-height:1.6}
</style>
</head>
<body>

<header>
  <div class="eyebrow"><span>MASS meet day</span>
    <div class="athchips" id="athchips"></div>
  </div>
  <h1 id="hd-name"></h1>
  <div class="sub" id="hd-sub"></div>
</header>

<!-- DAY SCHEDULE (collapsible) -->
<div class="sched" id="sched">
  <div class="sched-head" onclick="toggleSched()"><span class="st">Day schedule</span><span class="sched-sum" id="sched-sum"></span><span class="chev">&#9656;</span></div>
  <div class="sched-body" id="sched-rows"></div>
</div>

<!-- STICKY: attempts-out counter · session clock -->
<div class="stick">
  <div class="st-top">
    <div class="cnt">
      <button class="cbtn minus" onclick="bump(-1)">&minus;1</button>
      <span class="cnumwrap"><input id="cnum" inputmode="numeric" placeholder="#"><button class="info" onclick="toggleHint()">i</button></span>
      <span class="clab">out</span>
      <button class="cbtn plus" onclick="bump(1)">+1</button>
    </div>
    <div class="clk" id="clock" onclick="clockTap()">
      <div>
        <div class="cl-time" id="cl-time">0:00</div>
        <div class="cl-sub" id="cl-sub">tap to start</div>
      </div>
      <button class="crst" id="crst" onclick="event.stopPropagation();clockReset()" style="display:none">&#8634;</button>
    </div>
  </div>
  <div class="st-take" id="take-line"></div>
</div>

<!-- athlete cards are rendered here from the ATHLETES list below -->
<div id="athletes"></div>

<!-- TAB BAR -->
<div class="tabbar">
  <button id="tb-sn" class="on" onclick="setTab('sn')">Snatch</button>
  <button id="tb-cj" onclick="setTab('cj')">C&amp;J</button>
  <button id="tb-rules" onclick="setTab('rules')">Rules</button>
  <button id="tb-hist" onclick="setTab('hist')">History</button>
  <button id="tb-notes" onclick="setTab('notes')">Notes</button>
</div>

<script>
/* =====================================================================
   MEET + ATHLETES
   To bake an athlete's sheet: fill their entry below and bump planv.
   Bumping planv makes phones swap in the new warm-ups and attempts once
   (saved meets, notes, and records are kept).
   ===================================================================== */
const MEET={id:'newso26', name:'NE WSO Championships', when:'Oct 3-4, 2026'};

const BLANK_WU={
  sn:[["24","Warm-up","",""],["21","Warm-up","",""],["18","Snatch","",""],["15","Snatch","",""],["12","Snatch","",""],["9","Snatch","",""],["6","Snatch","",""],["3","Snatch","",""]],
  cj:[["21","Warm-up","",""],["18","Warm-up","",""],["15","C&J","",""],["12","C&J","",""],["9","C&J","",""],["6","C&J","",""],["3","C&J","",""]]
};
const BLANK_ATT=[["","",""],["","",""],["","",""]]; // [low, plan, high] per attempt
const STRAT_SN='<b>Opener is a bad-day weight.</b> After a miss the bar stays, repeat it. Easy make: nudge toward the high number. One warm-up every ~3 attempts on the cards, not the clock.';
const STRAT_CJ='<b>Never take the opener in the back room.</b> Last warm-up around opener minus 5. Late C&amp;J warm-ups space wider, ~every 4 attempts.';
const BLANK_SUB='numbers go in on the tabs, everything is editable';

const ATHLETES=[
  {id:'jacklyn', name:'Jacklyn', color:'#ec8fbf', bar:15, jumps:'women jump 2-3 kg', planv:'2',
   sub:'Entry 145 · Comp PRs: Sn 66 · C&J 80 · Total 145', snRef:'comp PR 66 · gym PR 67', cjRef:'comp PR 80 · gym PR 81',
   prTotal:145, cjCap:81, entry:'145', target:'148',
   wu:{sn:[["24","Tall + Drop","bar","3+3"],["21","Snatch","35","3"],["18","Snatch","45","3"],["15","Snatch","50","2"],["12","Snatch","53","1-2"],["9","Snatch","55","1"],["6","Snatch","58","1"],["3","Opener","61","1"]],
       cj:[["21","Mid pause","bar","2"],["18","Power 1st","35","2"],["15","C&J","45","2"],["12","C&J","55","2"],["9","C&J","65","1"],["6","C&J","70","1"],["3","Opener","74","1"]]},
   att:{sn:[["60","62","64"],["63","65","67"],["66","68","70"]], cj:[["70","72","74"],["74","76","78"],["78","80","82"]]},
   strat:{sn:STRAT_SN+' Last meet went 62 / 65 / -68. 66 ties her comp PR, 67 ties gym, the planned 68 third is a PR.',
          cj:'<b>Never take the opener in the back room.</b> Late C&amp;J warm-ups space wider, ~every 4 attempts. Last meet went 72 / -77 / 80. 80 ties her comp PR, 81 ties gym, 82 is new.'},
   history:[{date:'—',meet:'Last comp',bw:'',sn:[{kg:62,st:'g'},{kg:65,st:'g'},{kg:68,st:'m'}],cj:[{kg:72,st:'g'},{kg:77,st:'m'},{kg:80,st:'g'}],total:145}],
   refs:['66 · 67','80 · 81','145']},
  {id:'amy', name:'Amy', color:'#b287e8', bar:15, jumps:'women jump 2-3 kg', planv:'2',
   sub:'Entry not set · Comp PRs: Sn 66 · C&J 87 · Total 152', snRef:'comp PR 66 · 8 wk top 66', cjRef:'comp PR 87 · 8 wk top 85',
   prTotal:152, cjCap:87, entry:'', target:'150',
   wu:{sn:[["24","Tall Sn + Drop","bar","2"],["23","Snatch","35","2"],["21","Snatch","40","2"],["18","Snatch","45","1-2"],["15","Snatch","50","1"],["12","Snatch","53","1"],["9","Snatch","56","1"],["6","Snatch","59","1"],["3","Pull or snatch","62","1"]],
       cj:[["21","C&J","bar","2"],["18","C&J","35","2"],["15","C&J","45","2"],["12","C&J","55","1-2"],["9","C&J","65","1"],["6","C&J","70","1"],["3","C&J","74-75","1"]]},
   att:{sn:[["58","60","62"],["60","63","65"],["62","65","68"]], cj:[["75","78","80"],["78","82","85"],["81","85","88"]]},
   strat:{sn:STRAT_SN+' Last meet went 62 / 65 / -68. 66 ties her comp PR and her 8 week top. The 3-out set at 62 is a pull or a snatch.',
          cj:'<b>Never take the opener in the back room.</b> Last warm-up is 74-75. Late C&amp;J warm-ups space wider, ~every 4 attempts. Last meet went 80 / 85 / -88. 85 is her 8 week top, 87 ties her comp PR.'},

/* ===== storage =====

   The Bay State archive page uses its own unprefixed md_ keys; never wipe globally. */
function store(k,v){ try{localStorage.setItem('md_'+k,JSON.stringify(v))}catch(e){} }
function load(k){ try{const v=localStorage.getItem('md_'+k);return v?JSON.parse(v):null}catch(e){return null} }

function gload(k){ return load(MEET.id+'_'+k); }
function f(n){ return (+n).toFixed(1).replace(/\.0$/,''); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function aEl(a){ return document.querySelector('.ath[data-ath="'+(a||ATH)+'"]'); }

function plateText(kg,a){

}
function fmtElapsed(ms){

/* ===== session clock + last-set gap ===== */
let clockInt=null, clockStart=null;
function clockTap(){
  if(clockStart) return;
  clockStart=Date.now();
  gstore('ckstart',clockStart);
  startTick();
}
function clockReset(){
  clockStart=null; gstore('ckstart',null);
  clearInterval(clockInt); clockInt=null;
  document.getElementById('clock').classList.remove('run');
  document.getElementById('cl-time').textContent='0:00';
  document.getElementById('cl-sub').textContent='tap to start';
  document.getElementById('cl-sub').classList.remove('slow');
  document.getElementById('crst').style.display='none';
}
function startTick(){
  document.getElementById('clock').classList.add('run');
  document.getElementById('crst').style.display='';
  if(!clockInt) clockInt=setInterval(tickClock,500);
  tickClock();
}
function tickClock(){
  if(clockStart) document.getElementById('cl-time').textContent=fmtElapsed(Date.now()-clockStart);
  const sub=document.getElementById('cl-sub');
  const ls=LASTSET[ATH][LIFTS[ATH]];
  if(ls){
    const gap=Date.now()-ls;
    sub.textContent='last set '+fmtElapsed(gap)+' ago';
    sub.classList.toggle('slow',gap>=360000);
  } else {
    sub.textContent=clockStart?'session':'tap to start';
    sub.classList.remove('slow');
  }
}

function bump(d){
  const cur=CNT[ATH][LIFTS[ATH]];
  CNT[ATH][LIFTS[ATH]]=Math.max(0,(cur===null?0:cur)+d);
  HINT=false;
  gstore('cnt',CNT); syncCnum(); pace();
}
function syncCnum(){

function toggleHint(){ HINT=!HINT; renderTake(); }

/* pace */
function pace(){
  document.querySelectorAll('.ath').forEach(c=>{
    const a=c.dataset.ath;
    ['sn','cj'].forEach(key=>{
      const l=c.querySelector('.lift[data-lift="'+key+'"]');
      const rows=[...l.querySelectorAll('.wu-row')];
      rows.forEach(r=>r.classList.remove('due','late'));
      const cnt=CNT[a][key];
      if(cnt===null) return;
      const next=rows.find(r=>!r.classList.contains('done') && r.querySelector('.aout').value.trim()!=='' && !isNaN(parseInt(r.querySelector('.aout').value)));
      if(!next) return;
      const av=parseInt(next.querySelector('.aout').value);
      if(cnt===av) next.classList.add('due');
      else if(cnt<av) next.classList.add('late');
    });
  });
  renderTake();
}
function renderTake(){
  const el=document.getElementById('take-line');
  el.classList.remove('due','late');
  if(HINT){
    el.classList.add('show');
    el.innerHTML='Count the attempt cards before your lifter, tap the # and type the number. Tap &minus;1 each time the bar turns over. Warm-up rows: tap to check off, Edit to delete, + Add set to repeat. Tap any weight to edit it.';
    return;
  }
  const lift=LIFTS[ATH], cnt=CNT[ATH][lift];
  const m=ATHS[ATH];
  const tag='<span class="tl-lift" style="color:'+m.color+'">'+esc(m.name.toUpperCase())+' '+lift.toUpperCase()+'</span> · ';
  if(cnt===null){ el.classList.remove('show'); el.innerHTML=''; return; }
  el.classList.add('show');
  if(cnt===0){ el.innerHTML=tag+'Up now.'; return; }
  const l=aEl().querySelector('.lift[data-lift="'+lift+'"]');
  const rows=[...l.querySelectorAll('.wu-row')];
  const next=rows.find(r=>!r.classList.contains('done') && !isNaN(parseInt(r.querySelector('.aout').value)));
  if(!next){ el.innerHTML=tag+'Warm-ups done · '+cnt+' attempts out.'; return; }
  const av=parseInt(next.querySelector('.aout').value);
  const kg=esc(next.querySelector('.wkg').value)||'next set', reps=esc(next.querySelector('.reps').value);
  const set=kg+(reps?' × '+reps:'');
  if(cnt>av){ el.innerHTML=tag+'Next: '+set+' at '+av+' out.'; }
  else if(cnt===av){ el.classList.add('due'); el.innerHTML=tag+'TAKE NOW: '+set+'.'; }
  else { el.classList.add('late'); el.innerHTML=tag+'BEHIND · take '+set+' now.'; }
}

/* ===== warm-up rows ===== */
function makeRow(list,aout,set,kg,reps,done){
  const row=document.createElement('div');
  row.className='wu-row'+(done?' done':'');
  row.onclick=()=>{
    if(list.classList.contains('editing')) return;
    row.classList.toggle('done');
    if(row.classList.contains('done')){
      const a=athOf(row), key=row.closest('.lift').dataset.lift;
      LASTSET[a][key]=Date.now(); gstore('lastset',LASTSET); tickClock();
    }
    saveWU(athOf(row)); pace();
  };
  [['aout',aout,'numeric'],['set',set,null],['wkg',kg,null],['reps',reps,null]].forEach(([cls,val,mode])=>{
    const inp=document.createElement('input');
    inp.className=cls;
    if(mode) inp.inputMode=mode;
    inp.value=val;
    inp.onclick=e=>e.stopPropagation();
    inp.addEventListener('input',()=>{saveWU(athOf(row));pace();});
    row.appendChild(inp);
  });
  const chk=document.createElement('div');
  chk.className='chk'; chk.textContent='✓';
  row.appendChild(chk);
  const del=document.createElement('div');
  del.className='del'; del.textContent='✕';
  del.onclick=e=>{e.stopPropagation();const a=athOf(row);row.remove();saveWU(a);pace();};
  row.appendChild(del);
  list.appendChild(row);
}
function addRow(btn){
  const list=btn.closest('.lift').querySelector('.wu-list');
  const last=list.lastElementChild;
  const kg=last?last.querySelector('.wkg').value:'';
  makeRow(list,'','Repeat',kg,'1',false);
  saveWU(athOf(btn)); pace();
}
function toggleEdit(btn){
  const list=btn.closest('.lift').querySelector('.wu-list');
  const on=list.classList.toggle('editing');
  btn.classList.toggle('on',on);

}
function saveWU(a){
  const data={};
  aEl(a).querySelectorAll('.lift[data-lift]').forEach(l=>{
    data[l.dataset.lift]=[...l.querySelectorAll('.wu-row')].map(r=>[
      r.querySelector('.aout').value, r.querySelector('.set').value,
      r.querySelector('.wkg').value, r.querySelector('.reps').value,
      r.classList.contains('done')
    ]);
  });
  store(a+'_wu',data);
}
function initWU(a){
  const saved=load(a+'_wu');
  aEl(a).querySelectorAll('.lift[data-lift]').forEach(l=>{
    const key=l.dataset.lift, list=l.querySelector('.wu-list');
    const rows=(saved&&saved[key])?saved[key]:ATHS[a].wu[key].map(r=>[r[0],r[1],r[2],r[3],false]);
    rows.forEach(r=>makeRow(list,r[0],r[1],r[2],r[3],r[4]));
  });
}

/* ===== attempts ===== */
function liftState(key,a){
  const l=aEl(a).querySelector('.lift[data-lift="'+key+'"]');
  return [...l.querySelectorAll('.att')].map(x=>({
    kg:parseFloat(x.querySelector('.kg').value)||0,
    pl:parseFloat(x.querySelector('.pl').value)||0,
    hi:parseFloat(x.querySelector('.hi').value)||0,
    st:x.classList.contains('good')?'g':x.classList.contains('miss')?'m':''
  }));
}
function bestGood(atts){ return Math.max(0,...atts.filter(x=>x.st==='g').map(x=>x.kg)); }
function anyMarked(atts){ return atts.some(x=>x.st!==''); }
function liveOrPlanned(atts){
  if(anyMarked(atts)) return {val:bestGood(atts), live:true};
  return {val:atts[1]?atts[1].kg:0, live:false};
}
function step(btn,d){
  const att=btn.closest('.att'), a=athOf(btn);
  const inp=att.querySelector('.kg');
  let v=parseFloat(inp.value);
  if(isNaN(v)) v=parseFloat(att.querySelector('.pl').value)||0;
  v+=d;
  const atts=[...att.closest('.attempts').querySelectorAll('.att')];
  const i=atts.indexOf(att);
  if(i>0){
    const prev=atts[i-1];
    const pkg=parseFloat(prev.querySelector('.kg').value);
    if(!isNaN(pkg)){
      const min=prev.classList.contains('good')?pkg+1:pkg;
      if(v<min) v=min;
    }
  }
  if(v<0) v=0;
  inp.value=f(v);
  refreshPlates(a); saveAtts(a); renderForecast(a); suggAll(a);
}
function cycle(el){
  const att=el.parentNode, a=athOf(el);
  if(att.classList.contains('good')){att.classList.remove('good');att.classList.add('miss');el.textContent='✗ MISS';}
  else if(att.classList.contains('miss')){att.classList.remove('miss');el.textContent='SET';}
  else{att.classList.add('good');el.textContent='✓ GOOD';}
  saveAtts(a); renderForecast(a); suggAll(a);
}
function sugg(key,a){
  const panel=aEl(a).querySelector('.tab[data-tab="'+key+'"] .sugg');
  const atts=liftState(key,a);
  let msg='';
  for(let i=0;i<3;i++){
    if(atts[i].st==='m' && (i===2 || atts[i+1].st==='')){
      msg = i===2 ? '' : (atts[i].kg?'After the miss: repeat '+f(atts[i].kg)+'.':'');
      break;
    }
    if(atts[i].st==='g' && i<2 && atts[i+1].st===''){
      msg=atts[i+1].pl?('Made it. Next: plan '+f(atts[i+1].pl)+(atts[i+1].hi?' · easy make: push toward '+f(atts[i+1].hi):'')+'.'):'';
      break;
    }
  }
  panel.textContent=msg;
  panel.classList.toggle('show',msg!=='');
}
function suggAll(a){ sugg('sn',a); sugg('cj',a); }
function saveAtts(a){
  const data={};
  aEl(a).querySelectorAll('.lift[data-lift]').forEach(l=>{
    data[l.dataset.lift]=[...l.querySelectorAll('.att')].map(x=>({
      kg:x.querySelector('.kg').value, lo:x.querySelector('.lo').value,
      pl:x.querySelector('.pl').value, hi:x.querySelector('.hi').value,
      st:x.classList.contains('good')?'g':x.classList.contains('miss')?'m':''
    }));
  });
  store(a+'_atts',data);
}
function restoreAtts(a){
  const data=load(a+'_atts'); if(!data) return;
  aEl(a).querySelectorAll('.lift[data-lift]').forEach(l=>{
    const arr=data[l.dataset.lift]; if(!arr) return;
    l.querySelectorAll('.att').forEach((x,i)=>{
      if(!arr[i])return;
      x.querySelector('.kg').value=arr[i].kg;
      x.querySelector('.lo').value=arr[i].lo;
      x.querySelector('.pl').value=arr[i].pl;
      x.querySelector('.hi').value=arr[i].hi;
      const mk=x.querySelector('.mark');
      x.classList.remove('good','miss');
      if(arr[i].st==='g'){x.classList.add('good');mk.textContent='✓ GOOD';}
      else if(arr[i].st==='m'){x.classList.add('miss');mk.textContent='✗ MISS';}
      else mk.textContent='SET';
    });
  });
}
function refreshPlates(a){
  aEl(a).querySelectorAll('.att').forEach(x=>{
    x.querySelector('.plates').textContent=plateText(x.querySelector('.kg').value,a);
  });
}

/* ===== forecast, target, openers ===== */
function renderForecast(a){
  const c=aEl(a), m=ATHS[a];
  const sn=liftState('sn',a), cj=liftState('cj',a);
  const labs=['1st','2nd','3rd'];
  const snRes=liveOrPlanned(sn);
  c.querySelector('.sub-sn').innerHTML = (snRes.val?f(snRes.val):'&mdash;')+' <small>'+(snRes.live?'LIVE':'PROJ (2nd)')+'</small>';
  c.querySelector('.scen-sn').innerHTML = cj.map((x,i)=>
    '<div class="s'+(x.st==='m'?' dead':'')+'"><div class="sl">+CJ '+labs[i]+'</div><div class="sv">'+((snRes.val&&x.kg)?f(snRes.val+x.kg):'&mdash;')+'</div></div>').join('');
  const cjRes=liveOrPlanned(cj);
  const tot=snRes.val+cjRes.val;
  const live=snRes.live&&cjRes.live;
  c.querySelector('.sub-cj').innerHTML = (tot?f(tot):'&mdash;')+' <small>'+(live?'LIVE':'PROJ')+'</small>';
  let tiles='';
  if(m.prTotal&&tot){ const d=tot-m.prTotal; tiles+='<div class="s"><div class="sl">vs PR '+m.prTotal+'</div><div class="sv '+(d>=0?'ok':'halt')+'">'+(d>=0?'+':'')+f(d)+'</div></div>'; }
  const entry=parseFloat(c.querySelector('.entry').value);
  if(!isNaN(entry)&&tot){ const d=tot-entry; tiles+='<div class="s"><div class="sl">vs entry '+f(entry)+'</div><div class="sv '+(d>=0?'ok':'cau')+'">'+(d>=0?'+':'')+f(d)+'</div></div>'; }
  tiles+='<div class="s"><div class="sl">best sn + cj</div><div class="sv">'+((snRes.val||cjRes.val)?f(snRes.val)+' + '+f(cjRes.val):'&mdash;')+'</div></div>';
  c.querySelector('.scen-cj').innerHTML=tiles;
  const tgt=parseFloat(c.querySelector('.target').value);
  const nEl=c.querySelector('.needs');
  if(!isNaN(tgt)&&tgt>0&&snRes.val){
    const cjBest=bestGood(cj);
    if(cjBest>0 && snRes.val+cjBest>=tgt){ nEl.textContent='Target '+f(tgt)+' done: '+f(snRes.val+cjBest)+'.'; nEl.className='needs ok'; }
    else{
      const need=tgt-snRes.val;
      const hi3=cj[2].hi||cj[2].pl||cj[2].kg;
      nEl.textContent='Needs C&J ≥ '+f(need)+' for '+f(tgt)+'.';
      nEl.className='needs '+(hi3?(need<=hi3?'ok':(m.cjCap&&need<=m.cjCap?'cau':'halt')):(m.cjCap?(need<=m.cjCap?'cau':'halt'):''));
    }
  } else { nEl.textContent=''; nEl.className='needs'; }
  const oEl=c.querySelector('.openers-line');
  if(isNaN(entry)){ oEl.textContent='set the entry total for the openers check'; oEl.className='v openers-line'; }
  else if(sn[0].kg&&cj[0].kg){
    const sum=sn[0].kg+cj[0].kg, min=entry-20;
    oEl.textContent='openers '+f(sn[0].kg)+' + '+f(cj[0].kg)+' = '+f(sum)+' · need ≥ '+f(min);
    oEl.className='v openers-line '+(sum>=min?'ok':'halt');
  } else { oEl.textContent='set both openers'; oEl.className='v openers-line'; }
}

/* ===== save meet, export, reset ===== */
function saveMeet(){
  const a=ATH;
  const sn=liftState('sn',a), cj=liftState('cj',a);
  if(!anyMarked(sn)&&!anyMarked(cj)){ alert('Nothing marked yet. Mark attempts good or miss first.'); return; }
  const bs=bestGood(sn), bc=bestGood(cj);
  const rec={date:today(), meet:MEET.name, bw:schedVals(a).bw||'', sn:sn.map(x=>({kg:x.kg,st:x.st})), cj:cj.map(x=>({kg:x.kg,st:x.st})), total:(bs&&bc)?bs+bc:0};
  const meets=load(a+'_meets')||[];
  meets.unshift(rec);
  store(a+'_meets',meets);
  renderMeets(a);
  alert('Saved. It shows at the top of the history table on this phone.');
}
function renderMeets(a){
  const body=aEl(a).querySelector('tbody.meets');
  const meets=load(a+'_meets')||[];
  if(!meets.length && !ATHS[a].history.length){
    body.innerHTML='<tr><td class="empty" colspan="10">No meets logged yet. Save meet adds today’s.</td></tr>';
    return;
  }
  body.innerHTML=meets.map(histRow).join('');
}
function exportDay(btn){
  const a=ATH, m=ATHS[a], c=aEl(a);
  const sv=schedVals(a);
  const lines=[m.name+' · '+MEET.name+' · '+today()];
  if(sv.win||sv.bw||sv.sess||sv.plat) lines.push(['weigh-in '+(sv.win||'—'),'BW '+(sv.bw||'—'),'session '+(sv.sess||'—'),'platform '+(sv.plat||'—')].join(' · '));
  ['sn','cj'].forEach(key=>{
    const name=key==='sn'?'SNATCH':'C&J';
    const rows=[...c.querySelectorAll('.lift[data-lift="'+key+'"] .wu-row')].map(r=>{
      const kg=r.querySelector('.wkg').value, reps=r.querySelector('.reps').value;
      if(!kg) return null;
      return kg+(reps?'x'+reps:'')+(r.classList.contains('done')?' ✓':'');
    }).filter(Boolean);
    if(rows.length) lines.push(name+' warm-ups: '+rows.join(', '));
    const atts=liftState(key,a).map(x=>x.kg?(f(x.kg)+(x.st==='g'?' good':x.st==='m'?' miss':' —')):null).filter(Boolean);
    if(atts.length) lines.push(name+' attempts: '+atts.join(' · '));
  });
  const sn=liftState('sn',a), cj=liftState('cj',a);
  const bs=bestGood(sn), bc=bestGood(cj);
  if(bs&&bc) lines.push('Total: '+f(bs+bc)+(m.prTotal?(' (PR '+(bs+bc>=m.prTotal?'+':'')+f(bs+bc-m.prTotal)+')'):''));
  const notes=c.querySelector('.notes').value;
  if(notes) lines.push('Notes: '+notes);
  const text=lines.join('\n');
  const done=()=>{ btn.textContent='Copied'; setTimeout(()=>btn.textContent='Export day',1500); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(()=>prompt('Copy this:',text)); }
  else prompt('Copy this:',text);
}
function resetDay(){
  const m=ATHS[ATH];
  if(!confirm('Reset '+m.name+"'s day? Clears checkmarks, good/miss marks, counters, and day notes. All weights, saved meets, and records stay.")) return;
  const c=aEl(ATH);
  c.querySelectorAll('.wu-list').forEach(l=>l.classList.remove('editing'));
  c.querySelectorAll('.wu-edit').forEach(b=>{b.classList.remove('on');b.textContent='Edit';});
  c.querySelectorAll('.wu-row').forEach(r=>r.classList.remove('done'));
  c.querySelectorAll('.att').forEach(x=>{x.classList.remove('good','miss');x.querySelector('.mark').textContent='SET';});
  c.querySelector('.notes').value='';
  try{localStorage.removeItem('md_'+ATH+'_notes')}catch(e){}
  CNT[ATH]={sn:null,cj:null}; LASTSET[ATH]={sn:null,cj:null};
  gstore('cnt',CNT); gstore('lastset',LASTSET);
  saveWU(ATH); saveAtts(ATH);
  syncCnum(); pace(); renderForecast(ATH); suggAll(ATH);
}

/* ===== input routing ===== */
document.addEventListener('input',e=>{
  const t=e.target, ac=t.closest('.ath');
  if(ac){
    const a=ac.dataset.ath;
    if(t.classList.contains('kg')){refreshPlates(a);saveAtts(a);renderForecast(a);suggAll(a);}
    if(t.classList.contains('lo')||t.classList.contains('pl')||t.classList.contains('hi')){saveAtts(a);renderForecast(a);suggAll(a);}
    if(t.classList.contains('target')){store(a+'_target',t.value);renderForecast(a);}
    if(t.classList.contains('entry')){store(a+'_entry',t.value);renderForecast(a);}
    if(t.classList.contains('notes')){store(a+'_notes',t.value);}
    if(t.classList.contains('recl')||t.classList.contains('recv')){
      store(a+'_recs',[...ac.querySelectorAll('.recrow')].map(r=>[r.querySelector('.recl').value,r.querySelector('.recv').value]));
    }
    if(t.classList.contains('refv')){
      store(a+'_ref',[...ac.querySelectorAll('.refv')].map(i=>i.value));
    }
  }
  if(t.id==='cnum'){const v=parseInt(t.value);CNT[ATH][LIFTS[ATH]]=isNaN(v)?null:Math.max(0,v);HINT=false;gstore('cnt',CNT);t.classList.toggle('set',CNT[ATH][LIFTS[ATH]]!==null);pace();}
  if(t.classList.contains('swin')||t.classList.contains('sbw')||t.classList.contains('ssess')||t.classList.contains('splat')){
    const data={};
    document.querySelectorAll('.srow').forEach(r=>{data[r.dataset.ath]=[r.querySelector('.swin').value,r.querySelector('.sbw').value,r.querySelector('.ssess').value,r.querySelector('.splat').value];});
    gstore('sched',data);
    renderSchedSum();
  }
});

/* ===== init ===== */
renderAll();
document.querySelectorAll('.att input').forEach(i=>i.addEventListener('click',e=>e.stopPropagation()));
const sc=gload('cnt'), sl=gload('lastset'), sf=gload('lifts');
IDS.forEach(id=>{
  if(sc&&sc[id]) CNT[id]=Object.assign({sn:null,cj:null},sc[id]);
  if(sl&&sl[id]) LASTSET[id]=Object.assign({sn:null,cj:null},sl[id]);
  if(sf&&(sf[id]==='sn'||sf[id]==='cj')) LIFTS[id]=sf[id];
});
IDS.forEach(a=>{
  // new baked plan for this athlete: swap in its warm-ups and attempts once
  if(load(a+'_planv')!==ATHS[a].planv){
    try{localStorage.removeItem('md_'+a+'_wu');localStorage.removeItem('md_'+a+'_atts');}catch(e){}
    store(a+'_planv',ATHS[a].planv);
  }
  initWU(a);
  restoreAtts(a);
  const c=aEl(a);
  const tg=load(a+'_target'); if(tg!==null) c.querySelector('.target').value=tg;
  const en=load(a+'_entry'); if(en!==null) c.querySelector('.entry').value=en;
  const no=load(a+'_notes'); if(no) c.querySelector('.notes').value=no;
  const recs=load(a+'_recs'); if(recs) [...c.querySelectorAll('.recrow')].forEach((r,i)=>{ if(recs[i]){r.querySelector('.recl').value=recs[i][0];r.querySelector('.recv').value=recs[i][1];} });
  const ref=load(a+'_ref'); if(ref) [...c.querySelectorAll('.refv')].forEach((inp,i)=>{ if(ref[i]!==undefined) inp.value=ref[i]; });
  renderMeets(a);
  refreshPlates(a);
  renderForecast(a);
  suggAll(a);
});
const sched=gload('sched'); if(sched) document.querySelectorAll('.srow').forEach(r=>{ const s=sched[r.dataset.ath]; if(!s) return;
  r.querySelector('.swin').value=s[0]||''; r.querySelector('.sbw').value=s[1]||''; r.querySelector('.ssess').value=s[2]||''; r.querySelector('.splat').value=s[3]||'';
});
if(gload('schedopen')!==false) document.getElementById('sched').classList.add('open');
const sath=gload('ath'); if(sath&&ATHS[sath]) ATH=sath;
setAth(ATH);
setTab(gload('tab')||'sn');
const cks=gload('ckstart'); if(cks){ clockStart=cks; startTick(); }
if(!clockInt&&IDS.some(id=>LASTSET[id].sn||LASTSET[id].cj)){ clockInt=setInterval(tickClock,500); tickClock(); }
pace();
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
</script>
